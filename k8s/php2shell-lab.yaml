apiVersion: v1
kind: Namespace
metadata:
  name: php2shell-lab
---
# Declarative isolation. Flannel does not enforce NetworkPolicy, so the pod also
# locks down its own network namespace with iptables in an init container.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: php2shell-lab
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: v1
kind: Pod
metadata:
  name: php2shell-lab
  namespace: php2shell-lab
  labels:
    app.kubernetes.io/name: php2shell-lab
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  dnsPolicy: None
  dnsConfig:
    nameservers:
      - 127.0.0.1
  initContainers:
    - name: netns-lockdown
      image: ghcr.io/flannel-io/flannel:v0.28.5
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -e
          iptables -A INPUT -i lo -j ACCEPT
          iptables -A OUTPUT -o lo -j ACCEPT
          iptables -P INPUT DROP
          iptables -P OUTPUT DROP
          iptables -P FORWARD DROP
      securityContext:
        capabilities:
          drop: ["ALL"]
          add: ["NET_ADMIN"]
  containers:
    - name: web
      image: docker.io/bsalunke/php2shell-lab:8.2.32-distro
      imagePullPolicy: IfNotPresent
      # Bind Apache to loopback so nothing is reachable on the pod IP even if a
      # CNI ignores the NetworkPolicy.
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -e
          sed -i 's/^Listen 80$/Listen 127.0.0.1:80/' /etc/apache2/ports.conf
          exec apache2ctl -D FOREGROUND
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
          add: ["CHOWN", "DAC_OVERRIDE", "SETGID", "SETUID", "NET_BIND_SERVICE"]
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
