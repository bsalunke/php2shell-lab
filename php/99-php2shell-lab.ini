; php2shell-lab configuration
;
; These are PHP's factory defaults, written out explicitly so the lab's
; attack surface is obvious. Do not copy this file into production.

; On by default. This is the entry point for the upload-progress
; use-after-free (CVE-2026-109619).
session.upload_progress.enabled = On
session.upload_progress.cleanup = On

; The OOM trigger (CVE-2026-109618) relies on a finite per-request limit.
memory_limit = 128M

; Stock multipart limits.
post_max_size = 8M
file_uploads = On
max_file_uploads = 20
