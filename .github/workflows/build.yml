name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: PHP ${{ matrix.php_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php_version: "8.3.35"
            expect: vulnerable
          - php_version: "8.3.36"
            expect: patched

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          build-args: |
            PHP_VERSION=${{ matrix.php_version }}
          tags: php2shell-lab:${{ matrix.php_version }}

      - name: Start container
        run: docker run -d --name lab -p 8080:80 php2shell-lab:${{ matrix.php_version }}

      - name: Verify PHP2Shell status
        env:
          BASE_URL: http://localhost:8080
          EXPECT: ${{ matrix.expect }}
        run: ./scripts/verify.sh

      - name: Container logs
        if: failure()
        run: docker logs lab

      - name: Stop container
        if: always()
        run: docker rm -f lab || true
